appId: com.lancast.app
productName: LANCAST
copyright: GPL-3.0

directories:
  buildResources: build
  output: release

# electron-updater reads this provider from app-update.yml in the packaged
# application. The public release supplies latest.yml, the installer, and its
# blockmap so update checks and verified downloads require no account or token.
publish:
  - provider: github
    owner: Melqandil
    repo: Nocablecast

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# The bundled ffmpeg sits next to the app rather than inside the asar, so it
# can be executed as an ordinary binary.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter: ["**/*"]
  - from: resources/virtual-camera
    to: virtual-camera
    filter: ["**/*"]
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: LANCAST-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LANCAST

# Unsigned builds are normal for a small open-source tool; the README explains
# the SmartScreen prompt so nobody is surprised by it.
forceCodeSigning: false
